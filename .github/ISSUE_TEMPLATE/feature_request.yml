name: Feature request
description: Propose a capability or behavior change
title: "[feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please keep the core invariant in mind: `prepare` must never switch the desktop; `open` is the only explicit switch.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - desktop lifecycle
        - review packet / queue
        - commands / UX
        - native helper
        - docs / packaging
        - other
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants
      options:
        - label: This does not require `prepare` to switch the desktop.
          required: true
        - label: This does not auto-approve or auto-review tasks.
          required: true
